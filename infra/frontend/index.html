<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudfolio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 40px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header span { font-size: 0.9rem; color: #8892a4; }

    main {
      max-width: 960px;
      margin: 36px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .section { display: flex; flex-direction: column; gap: 28px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }
    .card h2.mt { margin-top: 24px; }

    .row { display: flex; gap: 16px; flex-wrap: wrap; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.75rem; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; }
    .field input {
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 150px;
      transition: border-color 0.15s;
    }
    .field input:focus { outline: none; border-color: #3b82f6; }
    .field input::placeholder { color: #9ca3af; }

    .ticker-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }

    .ticker-row { display: flex; align-items: center; gap: 8px; }
    .ticker-row input {
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 160px;
      text-transform: uppercase;
      transition: border-color 0.15s;
    }
    .ticker-row input:focus { outline: none; border-color: #3b82f6; }
    .ticker-row input::placeholder { text-transform: none; color: #9ca3af; }

    .btn-remove {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .btn-remove:hover { color: #ef4444; }

    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px dashed #d1d5db;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      color: #6b7280;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-add:hover { border-color: #3b82f6; color: #3b82f6; }

    .btn-generate {
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .btn-generate:hover:not(:disabled) { background: #2d2d4e; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.9rem;
    }

    /* ── Summary stats ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
    }
    .stat {
      background: #f9fafb;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-label { font-size: 0.72rem; color: #6b7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
    .stat-value.pos { color: #16a34a; }
    .stat-value.neg { color: #dc2626; }
    .stat-value.neu { color: #1a1a2e; }

    #chart-img { width: 100%; border-radius: 8px; }

    /* ── Tracker table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th {
      text-align: right;
      padding: 10px 14px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 2px solid #f3f4f6;
      white-space: nowrap;
    }
    thead th:first-child { text-align: left; }
    tbody tr { border-bottom: 1px solid #f3f4f6; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f9fafb; }
    tbody td { padding: 11px 14px; text-align: right; }
    tbody td:first-child { text-align: left; font-weight: 600; }
    .positive { color: #16a34a; }
    .negative { color: #dc2626; }

  </style>
</head>
<body>

<header>
  <h1>Cloudfolio</h1>
</header>

<main>

  <!-- ══ TRACKER SECTION ══ -->
  <div id="tracker-section" class="section">
    <div class="card">
      <h2>Configuration</h2>
      <div class="row" style="margin-bottom:24px;">
        <div class="field">
          <label>Index (benchmark)</label>
          <input type="text" id="index-input" value="VWRA.L" placeholder="e.g. VWRA.L" />
        </div>
        <div class="field">
          <label>Lookback (days)</label>
          <input type="number" id="days-input" value="30" min="7" max="3650" />
        </div>
      </div>

      <h2>Basket</h2>
      <div class="ticker-list" id="tracker-ticker-list"></div>
      <button class="btn-add" onclick="addTrackerTicker()">+ Add ticker</button>
    </div>

    <div>
      <button class="btn-generate" id="tracker-btn" onclick="generateReport()">
        Generate report
        <span class="spinner" id="tracker-spinner"></span>
      </button>
    </div>

    <div class="error-msg" id="tracker-error"></div>

    <div id="tracker-results" class="section" style="display:none;">
      <div class="card">
        <h2>Summary</h2>
        <div class="summary-grid" id="summary-grid"></div>
      </div>

      <div class="card">
        <h2>Performance chart</h2>
        <img id="chart-img" alt="Performance chart" />
      </div>

      <div class="card">
        <h2>Performance table</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ticker</th>
                <th>CCY</th>
                <th>Start</th>
                <th>End</th>
                <th>Local return %</th>
                <th>GBP return %</th>
                <th>vs Index (pp)</th>
                <th>Forex adj (pp)</th>
              </tr>
            </thead>
            <tbody id="tracker-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
  const API_URL = "__API_URL__";

  // ── Shared ticker helpers ───────────────────────────────────────────────────

  function addTickerToList(listId, value = "") {
    const list = document.getElementById(listId);
    const row = document.createElement("div");
    row.className = "ticker-row";
    row.innerHTML = `
      <input type="text" placeholder="e.g. AAPL or VWRA.L" value="${value}"
             oninput="this.value=this.value.toUpperCase()" />
      <button class="btn-remove" onclick="this.parentElement.remove()" title="Remove">×</button>
    `;
    list.appendChild(row);
    if (!value) row.querySelector("input").focus();
  }

  function addTrackerTicker(v) { addTickerToList("tracker-ticker-list", v); }

  function getTickersFrom(listId) {
    return [...document.querySelectorAll(`#${listId} input`)]
      .map(i => i.value.trim().toUpperCase())
      .filter(Boolean);
  }

  // ── Formatting ──────────────────────────────────────────────────────────────

  function fmt(val, decimals = 2) {
    if (val === null || val === undefined) return "—";
    const n = parseFloat(val);
    return (n >= 0 ? "+" : "") + n.toFixed(decimals);
  }

  function colorClass(val) {
    if (val === null || val === undefined) return "";
    return parseFloat(val) >= 0 ? "positive" : "negative";
  }

  // ── Tracker ─────────────────────────────────────────────────────────────────

  ["MSFT", "META", "AMZN"].forEach(t => addTrackerTicker(t));

  async function generateReport() {
    const btn     = document.getElementById("tracker-btn");
    const spinner = document.getElementById("tracker-spinner");
    const errorEl = document.getElementById("tracker-error");
    const results = document.getElementById("tracker-results");

    const tickers = getTickersFrom("tracker-ticker-list");
    const index   = document.getElementById("index-input").value.trim().toUpperCase();
    const days    = parseInt(document.getElementById("days-input").value);

    if (!tickers.length) { showError("tracker-error", "Please add at least one ticker."); return; }

    setLoading(btn, spinner, true);
    errorEl.style.display = "none";
    results.style.display = "none";

    try {
      const res  = await fetch(`${API_URL}/report`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tickers, index, days }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      renderSummary(data.summary);
      document.getElementById("chart-img").src = `data:image/png;base64,${data.chart_base64}`;
      renderTrackerTable(data.rows);
      results.style.display = "";
      results.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) {
      showError("tracker-error", `Error: ${err.message}`);
    } finally {
      setLoading(btn, spinner, false);
    }
  }

  function renderSummary(s) {
    const br = parseFloat(s.basket_avg_return_gbp_pct);
    const ir = parseFloat(s.index_return_gbp_pct);
    const bp = parseFloat(s.basket_vs_index_pp);
    const fx = parseFloat(s.forex.change_pct);
    document.getElementById("summary-grid").innerHTML = `
      <div class="stat">
        <div class="stat-label">Period</div>
        <div class="stat-value neu" style="font-size:1rem;margin-top:6px;">${s.period.start}<br/>→ ${s.period.end}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Basket avg (GBP)</div>
        <div class="stat-value ${br >= 0 ? "pos" : "neg"}">${fmt(br)}%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Index return (GBP)</div>
        <div class="stat-value ${ir >= 0 ? "pos" : "neg"}">${fmt(ir)}%</div>
      </div>
      <div class="stat">
        <div class="stat-label">Basket vs Index</div>
        <div class="stat-value ${bp >= 0 ? "pos" : "neg"}">${fmt(bp)} pp</div>
      </div>
      <div class="stat">
        <div class="stat-label">GBP/USD move</div>
        <div class="stat-value ${fx >= 0 ? "pos" : "neg"}">${fmt(fx)}%</div>
      </div>
    `;
  }

  function renderTrackerTable(rows) {
    document.getElementById("tracker-table-body").innerHTML = rows.map(r => `
      <tr>
        <td>${r.ticker}</td>
        <td>${r.currency}</td>
        <td>${r.start_price}</td>
        <td>${r.end_price}</td>
        <td class="${colorClass(r.return_local_pct)}">${fmt(r.return_local_pct)}%</td>
        <td class="${colorClass(r.return_gbp_pct)}">${fmt(r.return_gbp_pct)}%</td>
        <td class="${colorClass(r.vs_index_pp)}">${fmt(r.vs_index_pp)}</td>
        <td class="${colorClass(r.forex_adjustment_pp)}">${fmt(r.forex_adjustment_pp)}</td>
      </tr>
    `).join("");
  }

  // ── Shared utilities ────────────────────────────────────────────────────────

  function setLoading(btn, spinner, loading) {
    btn.disabled = loading;
    spinner.style.display = loading ? "inline-block" : "none";
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = "block";
  }
</script>

</body>
</html>
